const clamp01 = (v) => Math.max(0, Math.min(1, v))
const lerp = (a, b, k) => a + (b - a) * k
function bezier(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx
  const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by
  const sx = (u) => ((ax * u + bx) * u + cx) * u, sy = (u) => ((ay * u + by) * u + cy) * u, dx = (u) => (3 * ax * u + 2 * bx) * u + cx
  return (x) => {
    if (x <= 0) return 0
    if (x >= 1) return 1
    let u = x
    for (let i = 0; i < 8; i++) { const e = sx(u) - x; if (Math.abs(e) < 1e-6) return sy(u); const d = dx(u); if (Math.abs(d) < 1e-6) break; u -= e / d }
    let lo = 0, hi = 1; u = x
    while (hi - lo > 1e-6) { if (sx(u) < x) lo = u; else hi = u; u = (lo + hi) / 2 }
    return sy(u)
  }
}
const OUT = bezier(0.05, 0.7, 0.1, 1), IN = bezier(0.3, 0, 0.8, 0.15), STD = bezier(0.2, 0, 0, 1)
const prog = (t, t0, dur, ease = STD) => ease(clamp01((t - t0) / dur))
function spring(t, { duration = 0.5, bounce = 0 } = {}) {
  if (t <= 0) return 0
  const w = (2 * Math.PI) / duration, z = bounce >= 0 ? 1 - bounce : 1 / (1 + bounce)
  if (z < 1) { const wd = w * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + ((z * w) / wd) * Math.sin(wd * t)) }
  return 1 - Math.exp(-w * t) * (1 + w * t)
}
function hash(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) } return h >>> 0 }

const cPart = capHost.querySelector('#c-part'), cRow = capHost.querySelector('#c-row'), cN = capHost.querySelector('#c-n'), cT = capHost.querySelector('#c-t'), cS = capHost.querySelector('#c-s')

;(() => {

// ---- per-frame logic ---------------------------------------------------------------------------
function current(list, t) {
  let c = 0
  for (let i = 0; i < list.length; i++) if (t >= list[i][1]) c = i
  return c
}
function showShots(layerA, layerB, list, t, dirScale, baseTransform) {
  const c = current(list, t)
  const cur = list[c], prev = list[Math.max(0, c - 1)]
  const k = prog(t, cur[1], 0.34, OUT)
  const attach = (layer, n) => { if (layer._n !== n) { layer.innerHTML = ''; const im = imgs[n].cloneNode(); im.style.cssText = layer._css; layer.appendChild(im); layer._n = n } }
  layerA._css = layerB._css = dirScale
  attach(layerA, cur[0])
  if (c > 0 && k < 1) {
    attach(layerB, prev[0])
    layerB.style.opacity = (1 - k).toFixed(3); layerB.style.transform = `${baseTransform} translateX(${-k * 36}px)`
    layerA.style.opacity = k.toFixed(3); layerA.style.transform = `${baseTransform} translateX(${(1 - k) * 56}px)`
  } else {
    layerB.style.opacity = 0
    layerA.style.opacity = 1; layerA.style.transform = baseTransform
  }
  return { img: cur[0], t0: cur[1], settled: k >= 1 }
}
function dim(cls, x, y, w, h, a) { return `<div class="${cls}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;opacity:${a}"></div>` }
function fxHtml(t, shot, scale) {
  let h = ''
  for (const [s, t0, t1, r, pad, kind] of HL) {
    if (s !== shot || t < t0 || t > t1) continue
    const a = prog(t, t0, 0.25) * (1 - prog(t, t1 - 0.2, 0.2)) * (0.78 + 0.22 * Math.sin(t * 7))
    h += dim('rrect ' + kind, r.x - pad, r.y - pad, r.w + pad * 2, r.h + pad * 2, a.toFixed(3))
  }
  for (const [s, tt, p] of TAPS) {
    if (s !== shot) continue
    const a = tt - 0.45, d = t - a
    if (d < 0 || d > 1.1) continue
    const arrive = prog(t, a, 0.4, OUT)
    const x = lerp(p.x + 110, p.x, arrive), y = lerp(p.y + 140, p.y, arrive)
    const vis = clamp01(d / 0.1) * (1 - prog(t, tt + 0.25, 0.2))
    h += `<div class="touch" style="left:${x}px;top:${y}px;opacity:${vis};transform:scale(${t > tt ? 0.8 : 1})"></div>`
    const rp = prog(t, tt, 0.5, OUT)
    if (t > tt) h += `<div class="ring" style="left:${p.x - 14 - rp * 52}px;top:${p.y - 14 - rp * 52}px;width:${28 + rp * 104}px;height:${28 + rp * 104}px;opacity:${1 - rp}"></div>`
  }
  return h
}
function focusFor(t, shot) {
  let best = null
  for (const [s, t0, t1, x, y, sc] of FOCUS) {
    if (s !== shot || t < t0 - 0.9 || t > t1 + 0.9) continue
    const k = prog(t, t0, 0.9, STD) * (1 - prog(t, t1, 0.9, STD))
    if (k > 0.001) best = { x, y, k: sc > 1 ? 1 + (sc - 1) * k : 1, sc }
  }
  return best
}

window.seek = async function (t) {
  t = Math.min(t, CUES.duration)
  const surge = Math.max(0, 1 - Math.abs(t - HIT.stamp) * 2.2) * 0.5 + Math.max(0, 1 - Math.abs(t - HIT.outro) * 1.6) * 0.5 + Math.max(0, 1 - Math.abs(t - HIT.title) * 2) * 0.4
  redGlow.style.opacity = (0.55 + 0.2 * Math.sin(t * 1.1) + surge * 0.9).toFixed(3)
  smoke1.style.transform = `translate(${Math.sin(t * 0.35) * 40}px, ${Math.cos(t * 0.3) * -26}px)`
  smoke2.style.transform = `translate(${Math.sin(t * 0.3 + 2) * -46}px, ${Math.cos(t * 0.25) * -22}px)`
  clouds.style.transform = `translateX(${t * -5}px)`
  sporeEls.forEach((s, i) => {
    const per = 7 + rnd('sp' + i) * 6, ph = rnd('sq' + i) * per
    const p = ((t + ph) % per) / per
    s.style.transform = `translate(${rnd('sx' + i) * W + Math.sin(p * 6 + i) * 40}px,${H * (0.95 - p * 0.95)}px) scale(${0.6 + rnd('ss' + i) * 0.9})`
    s.style.opacity = (Math.sin(p * Math.PI) * 0.7).toFixed(3)
  })
  flowers.forEach((f) => { f.style.transform = `rotate(${f._f.r + Math.sin(t * 0.9 + f._i * 1.7) * 4}deg) scale(${1 + Math.sin(t * 0.6 + f._i) * 0.03})` })

  // lights: power up with flicker, then steady; quieter while the admin console fills the screen
  const adminK = prog(t, T_BROWSER_IN, 0.8) * (1 - prog(t, T_BROWSER_OUT, 0.8))
  gar.style.opacity = (1 - 0.82 * adminK).toFixed(3)
  bulbRefs.forEach((b, i) => {
    const on0 = 0.3 + i * 0.08 + rnd('on' + i) * 0.12
    const q = Math.floor(t * 24)
    const stutter = rnd(`f${i}-${q}`) < 0.05 || (t < on0 + 0.9 && rnd(`p${i}-${q}`) < 0.45) ? 0.18 : 1
    const k = clamp01((t - on0) / 0.5) * stutter
    const v = Math.min(1, k + surge * 0.4)
    b.g.setAttribute('opacity', (0.38 * v + surge * 0.3).toFixed(3))
    b.b.setAttribute('opacity', (0.1 + 0.9 * v).toFixed(3))
    b.h.setAttribute('opacity', (0.55 * v).toFixed(3))
  })

  // intro card
  const inIntro = t < V.staff.t - 0.2
  intro.style.display = inIntro ? 'block' : 'none'
  if (inIntro) {
    const ik = prog(t, 0.5, 0.8, OUT)
    iLogo.style.opacity = ik.toFixed(3)
    iKick.style.opacity = prog(t, 0.9, 0.7, OUT).toFixed(3)
    const lit = (span, t0) => { const q = Math.floor(t * 30); span.style.opacity = (t >= t0 ? (t < t0 + 0.35 ? (rnd(`${t0}-${q}`) < 0.5 ? 0.25 : 1) : 1) : 0).toFixed(3) }
    lit(iF, HIT.title); lit(iS, HIT.title + 0.28); lit(i2, HIT.title + 0.56)
    iSub.style.opacity = prog(t, HIT.title + 0.9, 0.6, OUT).toFixed(3)
    const out = prog(t, V.staff.t - 1.0, 0.8, IN)
    intro.style.opacity = (1 - out).toFixed(3)
    intro.style.transform = `translateY(${-out * 140}px) scale(${1 - out * 0.15})`
  }

  // caption
  let step = null
  for (const s of STEPS) if (t >= s.t0 && t < s.t1) step = s
  const browserNow = t >= T_BROWSER_IN - 0.3 && t < T_BROWSER_OUT
  if (!step) capHost.style.opacity = 0
  else {
    capHost.style.opacity = 1
    if (capHost._key !== step.part + step.n) {
      cPart.textContent = PARTNAME[step.part]; cN.textContent = step.n; cT.textContent = step.title; cS.textContent = step.sub; capHost._key = step.part + step.n
    }
    const inK = prog(t, step.t0, 0.5, OUT), outK = prog(t, step.t1 - 0.25, 0.25, IN)
    const a = inK * (1 - outK)
    const bro = step.part === 'P2'
    cPart.style.left = (bro ? 140 : 140) + 'px'; cPart.style.top = (bro ? 38 : 300) + 'px'
    cRow.style.left = '140px'; cRow.style.top = (bro ? 66 : 350) + 'px'
    cT.style.fontSize = (bro ? 54 : 70) + 'px'; cS.style.fontSize = (bro ? 28 : 36) + 'px'; cN.style.fontSize = (bro ? 110 : 150) + 'px'; cN.style.minWidth = (bro ? 100 : 130) + 'px'
    const dual = t >= HIT.tapConfirm - 0.2 && t < V.history.t
    if (dual) { cT.style.fontSize = '58px'; cS.style.fontSize = '32px' }
    capHost.style.opacity = a.toFixed(3)
    capHost.style.transform = `translateY(${(1 - inK) * 30 - outK * 16}px)`
  }

  // phones --------------------------------------------------------------------------------------
  const inP = t >= T_PHONE_IN && t < T_PHONE_OUT + 1.2
  phoneS.root.style.display = inP ? 'block' : 'none'
  if (inP) {
    const sp = spring(t - T_PHONE_IN, { duration: 0.85, bounce: 0.1 })
    const leave = prog(t, T_PHONE_OUT, 0.8, IN)
    const dualK = prog(t, HIT.tapConfirm - 0.1, 0.7, STD) * (1 - prog(t, V.history.t - 0.4, 0.7, STD))
    const cx = lerp(CX_SINGLE, CX_L, dualK)
    const y = (1 - sp) * 1100 + leave * 1400 + Math.sin(t * 0.9) * 7
    const sh = camShake(t)
    phoneS.root.style.left = cx - PW / 2 + 'px'
    phoneS.root.style.opacity = (clamp01((t - T_PHONE_IN) / 0.2) * (1 - clamp01((leave - 0.7) / 0.3))).toFixed(3)
    const shotS = showShots(phoneS.a, phoneS.b, STAFF, t, `width:390px;height:844px`, `scale(${S})`)
    const foc = focusFor(t, shotS.img)
    phoneS.root.style.transform = `translate(${sh.x}px, ${y + sh.y}px) rotate(${(1 - sp) * -6 + sh.r}deg)`
    phoneS.wrap.style.transformOrigin = foc ? `${foc.x * S}px ${foc.y * S}px` : '0 0'
    phoneS.wrap.style.transform = foc ? `scale(${foc.k})` : 'none'
    phoneS.fx.innerHTML = fxHtml(t, shotS.img, S)
  }
  // participant phone (confirm scene)
  const showR = t >= HIT.tapConfirm + 0.1 && t < V.history.t + 0.2
  phoneR.root.style.display = showR ? 'block' : 'none'
  if (showR) {
    const inK = spring(t - (HIT.tapConfirm + 0.1), { duration: 0.7, bounce: 0.08 })
    const outK = prog(t, V.history.t - 0.4, 0.7, IN)
    phoneR.root.style.left = CX_R - PW / 2 + 'px'
    phoneR.root.style.opacity = (clamp01((t - HIT.tapConfirm - 0.1) / 0.2) * (1 - outK)).toFixed(3)
    phoneR.root.style.transform = `translate(${(1 - inK) * 900 + outK * 900}px, ${Math.sin(t * 0.9 + 1) * 7}px) rotate(${(1 - inK) * 5}deg)`
    showShots(phoneR.a, phoneR.b, PART, t, `width:390px;height:844px`, `scale(${S})`)
    let h = ''
    const d = t - HIT.stamp
    if (t < HIT.stamp + 0.3) {
      const patch = t < HIT.stamp ? 1 : 1 - prog(t, HIT.stamp, 0.1)
      h += `<div style="position:absolute;left:118px;top:158px;width:154px;height:156px;background:rgb(233,225,211);opacity:${patch}"></div>`
      const p = prog(t, HIT.stamp - 0.18, 0.18, bezier(0.2, 0.6, 0.4, 1))
      const a = clamp01((t - (HIT.stamp - 0.18)) / 0.05) * (1 - prog(t, HIT.stamp + 0.1, 0.18))
      h += `<img src="../assets/stamp-korea-lg.webp" style="position:absolute;left:127px;top:166px;width:136px;height:136px;opacity:${a};transform:scale(${lerp(2.7, 1, p)}) rotate(${lerp(-12, 0, p)}deg)">`
    }
    if (d > 0 && d < 1.2) h += `<div style="position:absolute;left:50%;top:230px;width:420px;height:420px;margin:-210px 0 0 -210px;border-radius:50%;background:radial-gradient(rgba(255,120,100,${0.5 * (1 - d / 1.2)}),transparent 65%)"></div>`
    phoneR.fx.innerHTML = h
  }

  // browser (admin) -----------------------------------------------------------------------------
  const inB = t >= T_BROWSER_IN && t < T_BROWSER_OUT + 1.2
  brow.style.display = inB ? 'block' : 'none'
  if (inB) {
    const sp = spring(t - T_BROWSER_IN, { duration: 0.9, bounce: 0.06 })
    const leave = prog(t, T_BROWSER_OUT, 0.8, IN)
    brow.style.top = lerp(H + 40, BTOP, sp) + leave * 1300 + 'px'
    const shotB = showShots(bA, bB, ADMIN, t, 'width:1440px;height:810px', `scale(${BSC})`)
    bUrl.textContent = 'fs2-oct.vercel.app/' + ADMIN.find((s) => s[0] === shotB.img)[2]
    const foc = focusFor(t, shotB.img)
    bWrap.style.transformOrigin = foc ? `${foc.x * BSC}px ${foc.y * BSC}px` : '0 0'
    bWrap.style.transform = foc ? `scale(${foc.k})` : 'none'
    bFx.innerHTML = fxHtml(t, shotB.img, BSC)
  }

  // outro
  const inO = t > T_OUTRO - 0.4
  outro.style.display = inO ? 'block' : 'none'
  if (inO) {
    const ot = t - T_OUTRO
    oLogo.style.opacity = prog(t, T_OUTRO + 0.2, 0.7, OUT).toFixed(3)
    const q = Math.floor(t * 30)
    oFs.style.opacity = (prog(t, T_OUTRO - 0.05, 0.2) * (rnd('ofs-' + q) < 0.1 && ot < 0.4 ? 0.3 : 1)).toFixed(3)
    oFs.style.transform = `scale(${1.2 - 0.2 * OUT(clamp01(ot / 1.1))})`
    oTag.style.opacity = prog(t, V.outro.t + 0.9, 0.6, OUT).toFixed(3)
    oSub.style.opacity = (prog(t, V.outro.t + 1.7, 0.6, OUT) * 0.9).toFixed(3)

  // impacts

    wave.style.cssText += `;left:${CX_R - size / 2}px;top:${PHONE_CY - size / 2 - 80}px;width:${size}px;height:${size}px;opacity:${(1 - p) * 0.8}`
  } else wave.style.opacity = 0
  const fl = Math.max(0, 1 - Math.abs(d + 0.02) * 9) * 0.35 + Math.max(0, 1 - Math.abs(t - T_OUTRO) * 8) * 0.7 + Math.max(0, 1 - Math.abs(t - HIT.title) * 10) * 0.3
  flash.style.opacity = Math.min(0.8, fl).toFixed(3)

  const gq = Math.floor(t * 24)
  grain.style.transform = `translate(${Math.floor(rnd('gx' + gq) * 100)}px, ${Math.floor(rnd('gy' + gq) * 100)}px)`
  fade.style.opacity = (1 - prog(t, 0, 0.7, STD) + prog(t, CUES.duration - 0.8, 0.8, STD)).toFixed(3)
}

function camShake(t) {
  const d = t - HIT.stamp
  if (d < 0 || d > 0.7) return { x: 0, y: 0, r: 0 }
  const a = Math.exp(-d * 7) * 14
  return { x: Math.sin(d * 90) * a, y: Math.cos(d * 77) * a * 0.7, r: Math.sin(d * 60) * a * 0.03 }
}
